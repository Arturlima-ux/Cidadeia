name: capturas-temp
on:
  push:
    branches: [diag/capturas-morador]
permissions:
  contents: write
jobs:
  tirar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cd capturas && npm init -y >/dev/null && npm i playwright@1.56 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node tirar.mjs
      - run: |
          git config user.name capturas && git config user.email capturas@users.noreply.github.com
          git add capturas/*.png && git commit -m "capturas [skip ci]" && git push
