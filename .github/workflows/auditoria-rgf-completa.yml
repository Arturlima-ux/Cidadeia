name: investigacao-rgf
on:
  push:
    branches: [auditoria/rgf-completa]
permissions:
  contents: write
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y tsx@4 scripts/investigar-rgf.ts
      - run: |
          mkdir -p auditoria-resultado && mv investigacao.json auditoria-resultado/
          git config user.name auditoria && git config user.email auditoria@users.noreply.github.com
          git add auditoria-resultado && git commit -m "investigação [skip ci]" && git push
