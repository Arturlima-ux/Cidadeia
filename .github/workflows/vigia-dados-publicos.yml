name: vigia-dados-publicos
# Toda segunda e quinta-feira: confere, nos 5.571 municípios, o que o site diz sobre a
# despesa com pessoal, e confere o site no ar. Se algo regredir, abre um aviso
# (issue) no repositório, que chega por e-mail. Ver scripts/vigia/.
on:
  schedule:
    - cron: "17 9 * * 1,4"
  workflow_dispatch:
    inputs:
      so_site:
        description: "Conferir só o site no ar (pula a auditoria dos 5.571)"
        type: boolean
        default: false
permissions:
  contents: write # o panorama (src/dados/panorama-rgf.json) é publicado no main
  issues: write
jobs:
  # As obras federais por estado (ObrasGov): independente da auditoria do RGF.
  panorama-obras:
    if: ${{ !inputs.so_site }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contar as obras federais por situação em cada estado
        run: npx -y tsx@4 scripts/vigia/panorama-obras.ts src/dados/panorama-obras.json
      - name: Publicar
        run: |
          if git diff --quiet src/dados/panorama-obras.json; then echo "Sem mudança."; exit 0; fi
          git config user.name "vigia-cidadeia"
          git config user.email "vigia-cidadeia@users.noreply.github.com"
          git add src/dados/panorama-obras.json
          git commit -m "Panorama semanal das obras federais ($(date -u +%F))"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done

  auditoria:
    if: ${{ !inputs.so_site }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y tsx@4 scripts/vigia/auditoria-rgf.ts ${{ matrix.parte }} 8 parte${{ matrix.parte }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parte${{ matrix.parte }}
          path: parte${{ matrix.parte }}.json
          retention-days: 60

  verificar:
    needs: auditoria
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.so_site }}
        with:
          path: partes
      - name: Regras da auditoria
        id: regras
        if: ${{ !inputs.so_site }}
        run: npx -y tsx@4 scripts/vigia/verificar.ts partes
      - name: Publicar o panorama e a reserva da semana
        # Só com a auditoria aprovada: número suspeito não vai para a página pública.
        if: ${{ !inputs.so_site && steps.regras.outcome == 'success' }}
        run: |
          npx -y tsx@4 scripts/vigia/panorama.ts partes src/dados/panorama-rgf.json
          # A reserva do RGF para quando o Tesouro não responde (lib/rgf-reserva.ts).
          npx -y tsx@4 scripts/vigia/reserva.ts partes src/dados/rgf-reserva.json || echo "Reserva não atualizada."
          if git diff --quiet src/dados/panorama-rgf.json src/dados/rgf-reserva.json; then echo "Panorama sem mudança."; exit 0; fi
          git config user.name "vigia-cidadeia"
          git config user.email "vigia-cidadeia@users.noreply.github.com"
          git add src/dados/panorama-rgf.json src/dados/rgf-reserva.json
          git commit -m "Panorama e reserva semanais do RGF ($(date -u +%F))"
          git pull --rebase origin main && git push origin HEAD:main
      - name: Cabeçalho (só o site)
        if: ${{ inputs.so_site }}
        run: echo "## Vigia do site no ar — $(date -u +%F)" > resumo.md
      - name: Site no ar
        id: site
        if: always()
        run: |
          falhas=""
          confere() { # $1 código, $2 deve conter, $3 não pode conter, $4 nome
            pagina=$(curl -sS -m 120 "https://cidadeia.vercel.app/?m=$1" || true)
            echo "$pagina" | grep -q "$2" || falhas="$falhas\n- Site no ar, $4: não mostra \"$2\"."
            if [ -n "$3" ] && echo "$pagina" | grep -q "$3"; then falhas="$falhas\n- Site no ar, $4: mostra \"$3\"."; fi
          }
          confere 3201001 "RGF do" "nenhum consta no Tesouro" "Boa Esperança/ES"
          confere 5300108 "Governo do Distrito Federal" "nenhum consta no Tesouro" "Brasília/DF"
          confere 2605459 "distrito estadual" "" "Fernando de Noronha/PE"
          if [ -n "$falhas" ]; then printf "\n### Site no ar\n$falhas\n" >> resumo.md; exit 1; fi
      - name: Abrir aviso
        if: failure()
        run: |
          titulo="Vigia dos dados públicos encontrou problema"
          numero=$(gh issue list --state open --search "$titulo in:title" --json number --jq '.[0].number')
          echo "" >> resumo.md
          echo "Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> resumo.md
          if [ -n "$numero" ]; then gh issue comment "$numero" --body-file resumo.md
          else gh issue create --title "$titulo" --body-file resumo.md; fi
      - name: Resumo da execução
        if: always()
        run: cat resumo.md >> "$GITHUB_STEP_SUMMARY" || true
