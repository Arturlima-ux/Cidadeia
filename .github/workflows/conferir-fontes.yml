name: conferir-fontes
# Manual: pergunta uma vez a cada API pública nova e mostra o formato da
# resposta no log (scripts/vigia/conferir-fontes.ts).
on:
  workflow_dispatch:
    inputs:
      cnpj:
        description: "CNPJ de prefeitura para testar"
        default: "06553978000137"
      ibge:
        description: "Código IBGE do município"
        default: "2205300"
      so:
        description: "Conferir só uma fonte (ex.: siope); vazio confere todas"
        default: ""
permissions:
  contents: write # a saída vai para o ramo "conferencia-fontes", legível pela API
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y tsx@4 scripts/vigia/conferir-fontes.ts | tee saida.txt
        env:
          CNPJ_TESTE: ${{ inputs.cnpj }}
          IBGE_TESTE: ${{ inputs.ibge }}
          SO: ${{ inputs.so }}
      - name: Guardar a saída no ramo conferencia-fontes
        run: |
          git config user.name "vigia-cidadeia"
          git config user.email "vigia-cidadeia@users.noreply.github.com"
          git checkout --orphan conferencia-fontes
          git rm -rq --cached .
          git add saida.txt
          git commit -qm "Conferência das fontes ($(date -u +%F' '%T))"
          git push -f origin conferencia-fontes
