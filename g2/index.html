<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0a07">
<title>Pitanga Gastrobar · Palavras com peso</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="/assets/f/casa-1-w.webp" fetchpriority="high">
<!-- Instrument Serif: serifa display de alto contraste, estreita e de corpo leve; é o que dá o tom de revista (o Cormorant/Playfair "de sempre" ficou genérico).
     Hanken Grotesk: grotesca calma e neutra para os textos miúdos; some e deixa a foto falar. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{
  --ivory:#f6ecdc;
  --ivory-2:rgba(246,236,220,.72);
  --coral:#ff6a4d;
  --ink:#0e0906;
  --hair:rgba(246,236,220,.26);
  --serif:"Instrument Serif","Cormorant Garamond",Georgia,serif;
  --sans:"Hanken Grotesk",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,.7,.12,1);
  --h:100vh;
}
@supports (height:100dvh){:root{--h:100dvh}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:var(--ivory);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--ivory);outline-offset:3px}

/* ============ ENTRADA ============ */
.entrada{position:fixed;inset:0;height:var(--h);overflow:hidden;background:var(--ink);isolation:isolate;
  transition:filter 1.1s ease}
.entrada.walk{filter:brightness(.62)}
.ph{position:absolute;inset:0}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
/* a sala apagada: fria, escura */
.ph.dim{opacity:0;transition:opacity 1s ease}
.ph.dim img{filter:brightness(.4) saturate(.4) contrast(1.12)}
.cool{position:absolute;inset:0;background:#14233f;opacity:0;mix-blend-mode:color;pointer-events:none}
.ph.dim.on{opacity:1}
/* a sala acesa: a mesma foto, revelada por máscaras radiais presas às luminárias */
.ph.lit{opacity:0}
.ph.lit img{filter:saturate(1.06) contrast(1.03);transition:filter .7s ease}
.world.sel .ph.lit img{filter:saturate(1.12) contrast(1.05) brightness(1.2)}
.halos{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
.halo{position:absolute;left:0;top:0;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;opacity:0;transform:scale(.4);
  background:radial-gradient(circle,rgba(255,214,150,.62) 0,rgba(255,170,90,.26) 22%,rgba(255,140,60,.08) 48%,transparent 70%)}
.core{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;opacity:0;background:#fff3d8;
  box-shadow:0 0 10px 3px rgba(255,226,170,.95),0 0 26px 8px rgba(255,190,110,.6);mix-blend-mode:screen}
.pglow{position:absolute;left:0;top:0;pointer-events:none;border-radius:50%;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(closest-side,rgba(255,196,120,.34),rgba(255,160,80,.12) 55%,transparent)}
.vig{position:absolute;inset:-150%;pointer-events:none;opacity:1;transform:scale(.4);
  background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(9,6,4,0) 30%,rgba(9,6,4,.5) 68%,rgba(9,6,4,.94) 100%)}
.scrim{position:absolute;inset:0;pointer-events:none;
  background:
   linear-gradient(to bottom,rgba(14,9,6,.62) 0,rgba(14,9,6,.22) 11%,rgba(14,9,6,0) 22%),
   linear-gradient(to top,rgba(14,9,6,.94) 0,rgba(14,9,6,.9) 24%,rgba(14,9,6,.8) 40%,rgba(14,9,6,.42) 55%,rgba(14,9,6,0) 68%)}

.logo{position:absolute;left:20px;top:calc(env(safe-area-inset-top) + 16px);display:block;width:116px;opacity:0;transform:translateY(-6px);
  transition:opacity 1.1s ease,transform 1.1s var(--ease);padding:4px 0}
.logo img{display:block;width:100%;height:auto;filter:drop-shadow(0 1px 12px rgba(0,0,0,.45))}
.logo.on{opacity:1;transform:none}

.copy{position:absolute;left:20px;right:20px;bottom:var(--stack,250px);}
.copy h1{font-family:var(--serif);font-weight:400;color:var(--ivory);
  font-size:min(9.2vw,4.2vh);line-height:1.03;letter-spacing:-.012em;margin-bottom:.46em}
.ln{display:block;overflow:hidden;padding:.06em 0 .12em;margin:-.06em 0 -.12em}
.ln>span{display:block;transform:translateY(112%);opacity:0;transition:transform 1.15s var(--ease),opacity .9s ease}
.ln.on>span{transform:none;opacity:1}
.copy .q{display:block;font-family:var(--serif);font-style:italic;font-size:min(7.6vw,3.5vh);line-height:1.1;color:var(--coral);
  opacity:0;transform:translateY(8px);transition:opacity 1.2s ease,transform 1.2s var(--ease)}
.copy .q.on{opacity:1;transform:none}

.dock{position:absolute;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom)}
.strips{display:block}
.strip{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;height:clamp(66px,9.2vh,84px);padding:0 20px;overflow:hidden;
  border-top:1px solid var(--hair);opacity:0;transform:translateY(14px);pointer-events:none;
  transition:opacity 1.1s ease,transform 1.1s var(--ease)}
.strip.on{opacity:1;transform:none;pointer-events:auto}
.strip .sp{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;transform:scale(1.04);transition:transform 1.4s var(--ease),filter .5s ease;filter:brightness(.82) saturate(1.05)}
.strip::before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(to right,rgba(14,9,6,.78) 0,rgba(14,9,6,.52) 52%,rgba(14,9,6,.12) 100%)}
.strip .t,.strip svg{position:relative;z-index:2}
.strip .t{font-family:var(--serif);font-size:clamp(25px,3.5vh,29px);line-height:1;letter-spacing:-.006em;color:var(--ivory);text-shadow:0 1px 14px rgba(0,0,0,.4)}
.strip svg{width:34px;height:12px;flex:none;stroke:var(--ivory);fill:none;stroke-width:1.1;transition:transform .5s var(--ease)}
.strip:active .sp{filter:brightness(1.05) saturate(1.1);transform:scale(1.09)}
.strip:active svg{transform:translateX(5px)}
@media (hover:hover){.strip:hover .sp{filter:brightness(1.02);transform:scale(1.08)}.strip:hover svg{transform:translateX(5px)}}
.strip.s1{border-top-color:rgba(246,236,220,.34)}

.foot{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;row-gap:0;padding:11px 20px 0;
  font-size:11px;line-height:1.35;letter-spacing:.025em;color:var(--ivory-2);background:rgba(14,9,6,.96);
  opacity:0;transition:opacity 1.2s ease}
.foot.on{opacity:1}
.foot span{display:block;padding:0 0 3px}
.foot .adr{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(246,236,220,.14);margin-top:8px}
.foot .adr span{padding:0}
.foot a{display:inline-flex;align-items:center;min-height:44px;padding-left:16px;color:var(--ivory);text-decoration:none;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.foot a i{display:block;position:relative;padding-bottom:2px;font-style:normal;border-bottom:1px solid var(--coral)}
.foot .adr span{color:var(--ivory-2)}

/* ============ CENA (placeholder da próxima tela) ============ */
#ring{position:fixed;inset:0;z-index:20;pointer-events:none;mix-blend-mode:screen;opacity:0}
.cena{position:fixed;inset:0;z-index:30;height:var(--h);overflow:hidden;background:var(--ink);visibility:hidden;clip-path:circle(0px at 50% 50%)}
.cena.show{visibility:visible}
.cena .bg{position:absolute;inset:0;transform:scale(1.16);filter:brightness(.45) saturate(.7);
  transition:transform 2.1s var(--ease),filter 1.9s ease}
.cena .bg img{width:100%;height:100%;object-fit:cover;display:block}
.cena.lit .bg{transform:scale(1);filter:brightness(1) saturate(1.05)}
.cena .sc{position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(14,9,6,.6) 0,rgba(14,9,6,0) 24%),linear-gradient(to top,rgba(14,9,6,.88) 0,rgba(14,9,6,.55) 34%,rgba(14,9,6,0) 62%)}
.volt{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 10px);display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 10px;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--ivory);opacity:0;transition:opacity .9s ease .9s}
.volt svg{width:30px;height:12px;stroke:var(--ivory);fill:none;stroke-width:1.1}
.cena.lit .volt{opacity:1}
.cn{position:absolute;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 44px)}
.cn small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ivory-2);margin-bottom:18px;
  opacity:0;transition:opacity 1s ease .9s}
.cn h2{font-family:var(--serif);font-weight:400;font-size:min(15vw,7vh);line-height:.98;letter-spacing:-.02em}
.cn .ln>span{transition-delay:.7s}
.cn .rule{height:1px;background:var(--hair);margin:22px 0 14px;transform:scaleX(0);transform-origin:left;transition:transform 1.4s var(--ease) 1.1s}
.cn p{font-size:12px;line-height:1.5;color:var(--ivory-2);letter-spacing:.02em;opacity:0;transition:opacity 1s ease 1.4s}
.cena.lit .cn small,.cena.lit .cn p{opacity:1}
.cena.lit .cn .ln>span{transform:none;opacity:1}
.cena.lit .cn .rule{transform:none}


/* ============ ENTRADAS v4: e=0 faixas | e=1 luminárias | e=2 quadros | e=3 lanterna ============ */
.world{position:absolute;inset:0;transform-origin:50% 50%;transition:transform 1.05s cubic-bezier(.55,0,.2,1)}
.dimmer{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .7s ease}
#ents{position:absolute;inset:0;pointer-events:none}
body.e0 #ents,body.e1 .strips,body.e2 .strips,body.e3 .strips{display:none}
.ent{position:absolute;z-index:6;opacity:0;pointer-events:none;transition:opacity 1.4s ease}
.ent.on{opacity:1;pointer-events:auto}
.hit{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0;display:block}
.cap{font-family:var(--serif);color:var(--ivory);line-height:1;letter-spacing:-.004em;white-space:nowrap;
  text-shadow:0 0 18px rgba(14,9,6,.85),0 1px 3px rgba(14,9,6,.7),0 0 2px rgba(14,9,6,.6)}
body:not(.e0) .logo{left:50%;width:94px;margin-left:-47px}
.entrada.zoom .copy,.entrada.zoom .dock,.entrada.zoom .ent,.entrada.zoom .logo{opacity:0!important;transition:opacity .5s ease!important}
/* e=1 */
.e1b{display:block}
.e1b .cap{position:absolute;left:12px;top:40px;font-size:23px;pointer-events:none}
.e1b:focus-within .cap,.e2b:focus-within .cap{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px;text-decoration-color:var(--coral)}
/* e=2 */
.e2b .hit{-webkit-clip-path:var(--poly);clip-path:var(--poly)}
.e2p{position:absolute;z-index:6;cursor:pointer}
.e2p .cap{display:block;font-size:22px;font-style:italic;padding-top:11px;position:relative}
.e2p .cap::before{content:"";position:absolute;left:0;top:0;width:26px;height:1px;background:var(--ivory)}
.e2p.r .cap::before{left:auto;right:0}
/* e=3 */
body.e3 .world{filter:brightness(.82)}
body.e3 .copy h1{font-size:min(8.4vw,3.8vh)}
body.e3 .copy .q{font-size:min(6.8vw,3.1vh)}
body.e3 .entrada{touch-action:none}
.names{position:absolute;left:0;right:0;z-index:6;pointer-events:none}
.nm{display:block;width:100%;height:56px;padding:0 20px;color:rgba(246,236,220,.92);font-family:var(--serif);font-size:min(10vw,4.8vh);line-height:56px;letter-spacing:-.012em;
  text-shadow:0 1px 16px rgba(14,9,6,.6);opacity:0;pointer-events:none;transition:opacity 1.4s ease;white-space:nowrap}
.nm.on{opacity:1;pointer-events:auto}
.nm:focus-visible{outline:0;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:8px;text-decoration-color:var(--coral)}
.lantern{position:absolute;left:0;top:0;width:400px;height:400px;margin:-200px 0 0 -200px;border-radius:50%;pointer-events:none;z-index:7;
  mix-blend-mode:screen;opacity:0;transition:opacity .62s ease;will-change:transform;
  background:radial-gradient(circle,rgba(255,216,160,.62) 0,rgba(255,176,104,.3) 34%,rgba(255,150,80,.08) 62%,transparent 72%)}
.lantern.on{opacity:1;transition-duration:.14s}


/* ============ e=4 PALAVRAS COM PESO: as palavras são objetos sobre a mesa ============ */
body.e4 .strips{display:none}
body.e4 .copy{z-index:5}
body.e4 .dock{z-index:6}
body.e4 .copy h1{font-size:min(8.2vw,3.7vh);margin-bottom:.38em}
body.e4 .ln{overflow:visible;padding:0;margin:0}
body.e4 .ln>span{display:block;transform:none;opacity:1;transition:none}
body.e4 .copy .q{font-size:min(6.8vw,3.1vh);opacity:1;transform:none;transition:none}
.fr{display:block;margin-top:min(5.4vw,2.7vh);font-family:var(--serif);font-weight:400;font-size:min(9vw,4.2vh);line-height:1.12;letter-spacing:-.012em;color:var(--ivory)}
.fr .fl{display:block;white-space:nowrap}
body.e4 .copy h1,body.e4 .fr{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pw{display:inline-block;position:relative;transform-origin:50% 50%;will-change:transform;opacity:0;white-space:nowrap;
  text-shadow:0 0 14px rgba(14,9,6,.78),0 1px 2px rgba(14,9,6,.55);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pw.v{opacity:1}
/* sombra de contato: some quando a palavra está no ar, firma quando pousa */
.pw::after{content:"";position:absolute;left:4%;right:4%;bottom:.03em;height:.16em;border-radius:50%;z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side,rgba(0,0,0,.62),rgba(0,0,0,0));filter:blur(2px);opacity:var(--so,0);transform:translateY(.16em) scaleX(var(--ss,1))}
.pw.w{font:inherit;font-style:italic;letter-spacing:inherit;color:var(--coral);padding:.12em .3em;margin:-.12em -.3em;pointer-events:none;
  touch-action:none;cursor:grab;animation:breathe 3.8s ease-in-out infinite}
.pw.w+.pw.w{animation-delay:1.9s}
.pw.w.ready{pointer-events:auto}
.pw.w.lift{cursor:grabbing;filter:drop-shadow(0 14px 14px rgba(0,0,0,.6)) drop-shadow(0 0 16px rgba(255,150,90,.45));animation:none;opacity:1}
.pw.w .c{display:inline-block;white-space:pre}
@keyframes breathe{0%,100%{opacity:.8;text-shadow:0 0 0 rgba(255,120,80,0)}50%{opacity:1;text-shadow:0 0 18px rgba(255,120,80,.46)}}
@keyframes inkrun{0%{color:var(--coral);text-shadow:0 0 0 rgba(255,190,110,0);transform:none}
  45%{color:#fff3d6;text-shadow:0 0 22px rgba(255,200,130,.95),0 0 4px rgba(255,236,200,.8);transform:translateY(-.05em)}
  100%{color:#ffe7bf;text-shadow:0 0 14px rgba(255,190,110,.6);transform:none}}
.pw.w.ink{animation:none;opacity:1}
.pw.w.ink .c{animation:inkrun .34s ease-out forwards;animation-delay:calc(var(--i)*var(--st,26ms))}
.pw.w:focus-visible{outline:1px solid rgba(255,231,191,.7);outline-offset:4px;border-radius:2px}
.entrada.pick .pw.v:not(.w){opacity:.32;transition:opacity .7s ease}
.entrada.pick .foot{opacity:.35;transition:opacity .6s ease}
/* efeitos de luz (ficam por baixo das palavras) */
#fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.pool{position:absolute;left:0;top:0;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;opacity:0;mix-blend-mode:screen;transition:opacity .55s ease;
  background:radial-gradient(circle,rgba(255,206,140,.5),rgba(255,160,80,.18) 44%,transparent 68%)}
.pring{position:absolute;left:0;top:0;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;opacity:0;transition:opacity .55s ease;
  border:1px solid rgba(255,214,160,.55);box-shadow:0 0 22px rgba(255,170,90,.3),inset 0 0 16px rgba(255,170,90,.18)}
.pool.hint{opacity:.2}.pring.hint{opacity:.28}
.pool.on{opacity:.95}.pring.on{opacity:.9}
.wv{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle closest-side,rgba(255,200,130,0) 84%,rgba(255,214,160,.55) 94%,rgba(255,190,110,0) 100%)}
.fl2{position:absolute;width:300px;height:300px;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle closest-side,rgba(255,238,200,.95),rgba(255,190,110,.45) 40%,transparent 72%)}
@media (prefers-reduced-motion:reduce){.pw.w{animation:none;opacity:1}.pw.w.ink .c{animation:none;color:#ffe7bf}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<main>
<section class="entrada" id="entrada" aria-label="Entrada">
  <div class="world" id="world"><div class="ph dim" id="dim"><img id="imgDim" src="/assets/f/casa-1-w.webp" alt="" decoding="async" fetchpriority="high"><div class="cool" id="cool"></div></div>
  <div class="ph lit" id="lit"><img id="imgLit" src="/assets/f/casa-1-w.webp" alt="Salão do Pitanga: parede laranja, três quadros e luminárias acesas" decoding="async"></div>
  <div class="halos" id="halos" aria-hidden="true"></div>
  <div class="vig" id="vig" aria-hidden="true"></div><div class="dimmer" id="dimmer" aria-hidden="true"></div></div>
  <div class="scrim" aria-hidden="true"></div>

  <a class="logo" id="logo" href="#" aria-label="Pitanga Gastrobar" onclick="return false"><img src="/assets/f/logo.png" alt="Pitanga Gastrobar" width="608" height="308"></a>

  <div id="fx" aria-hidden="true"></div>
  <div class="copy" id="copy">
    <h1 id="h1">
      <span class="ln"><span>Aqui, cada prato</span></span>
      <span class="ln"><span>tem nome de canção,</span></span>
      <span class="ln"><span>de poema,</span></span>
      <span class="ln"><span>de escritora.</span></span>
    </h1>
    <span class="q" id="q">Qual será o seu?</span>
    <p class="fr" id="fr"></p>
  </div>

  <div id="ents"></div><div class="lantern" id="lantern" aria-hidden="true"></div>
  <div class="dock" id="dock">
    <div class="strips">
      <button class="strip s1" type="button" data-go="reserva"><span class="sp" style="background-image:url(/assets/f/casa-2-w.webp);background-position:50% 36%"></span><span class="t">Escrever a visita</span><svg viewBox="0 0 34 12" aria-hidden="true"><path d="M0 6h33M28 1l5 5-5 5"/></svg></button>
      <button class="strip s2" type="button" data-go="carta"><span class="sp" style="background-image:url(/assets/f/mignon-g.webp);background-position:50% 58%"></span><span class="t">Folhear a carta</span><svg viewBox="0 0 34 12" aria-hidden="true"><path d="M0 6h33M28 1l5 5-5 5"/></svg></button>
    </div>
    <div class="foot" id="foot">
      <span>Almoço sexta a domingo · 12h</span>
      <span>Jantar segunda a sábado · 18h</span>
      <div class="adr"><span>Av. João XXIII, 1161 · Jóquei</span><a href="https://www.google.com/maps/search/?api=1&amp;query=Av.+Jo%C3%A3o+XXIII%2C+1161%2C+J%C3%B3quei%2C+Teresina" target="_blank" rel="noopener"><i>Como chegar</i></a></div>
    </div>
  </div>
</section>

<div id="ring" aria-hidden="true"></div>

<section class="cena" id="cena" role="dialog" aria-modal="true" aria-labelledby="cenaT" aria-hidden="true">
  <div class="bg"><img id="cenaImg" alt=""></div>
  <div class="sc"></div>
  <button class="volt" id="volt" type="button"><svg viewBox="0 0 30 12" aria-hidden="true"><path d="M30 6H1M6 1L1 6l5 5"/></svg>voltar</button>
  <div class="cn">
    <small>Próxima cena</small>
    <h2 id="cenaT"><span class="ln"><span id="cenaL"></span></span></h2>
    <div class="rule"></div>
    <p>Aqui começa a próxima tela do Pitanga.</p>
  </div>
</section>
</main>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var ent=$("entrada"),imgs=[$("imgDim"),$("imgLit")],lit=$("lit"),dim=$("dim"),halos=$("halos"),vig=$("vig"),cool=$("cool");
  var IW=1755,IH=1545;               /* tamanho natural da foto */
  var Q=(location.search.match(/[?&]e=(\d)/)||[])[1],E=Q==null?4:+Q;if(E>4)E=4;

  function burst(x,y){
    if(RM||!fx.animate)return;
    var R=Math.max(geo.W,geo.H)*.8;
    [0,150,320].forEach(function(dl,i){
      var d=document.createElement("i");d.className="wv";d.style.cssText="left:"+(x-R)+"px;top:"+(y-R)+"px;width:"+2*R+"px;height:"+2*R+"px";fx.appendChild(d);
      var a=d.animate([{transform:"scale(.04)",opacity:.95-.2*i},{transform:"scale(1)",opacity:0}],{duration:1400+i*160,delay:dl,easing:"cubic-bezier(.12,.6,.2,1)",fill:"both"});
      a.onfinish=function(){d.remove()};
    });
    var f=document.createElement("i");f.className="fl2";f.style.cssText="left:"+(x-150)+"px;top:"+(y-150)+"px";fx.appendChild(f);
    var b=f.animate([{transform:"scale(.3)",opacity:1},{transform:"scale(1.7)",opacity:0}],{duration:780,easing:"ease-out",fill:"both"});b.onfinish=function(){f.remove()};
  }
  function shock(src,z){
    P.forEach(function(p){
      if(p===src||p.mode==="hid"||p.live&&p.landed)return;
      var c=rc(p),dx=c.x-z.x,dy=c.y-z.y,d=Math.hypot(dx,dy)||1,amp=Math.max(.3,Math.exp(-d/900));
      setTimeout(function(){if(p.mode==="air"||p.mode==="ret"){p.vy-=190+250*amp;p.vx+=dx/d*70;p.vr+=rnd(-70,70);p.qv+=.6;wake(p)}},d*1.05);
    });
  }
  function land(p){
    p.landed=true;p.mode="lock";p.st=1.22;p.qv+=3.6;
    p.el.classList.remove("lift");p.el.classList.add("ink");
    var z=zone(p.live.lampI);
    burst(z.x,z.y);lightUp(p.live.lampI);shock(p,z);
    setTimeout(function(){openScene(p.live.key,z.x,z.y,p.el)},RM?0:950);
  }
  function target(p,i){var z=zone(i),c=rc(p);p.tx=z.x-c.x;p.ty=z.y-c.y}
  function fly(p,vy){
    picked=true;p.mode="fly";p.landed=false;p.ts=performance.now();p.st=1.3;
    target(p,p.live.lampI);if(vy!=null){p.vy=vy;p.vx=0}
    showPools(p.live.lampI);wake(p);
  }
  function fireRM(p){
    picked=true;p.landed=true;p.el.classList.add("ink");var z=zone(p.live.lampI);lightUp(p.live.lampI);openScene(p.live.key,z.x,z.y,p.el);
  }
  function tap(p){if(picked)return;interacted=true;if(RM)fireRM(p);else fly(p,-560)}
  function giveBack(p){p.mode="ret";p.st=1;p.el.classList.remove("lift");hidePools();wake(p)}

  /* ---- toque e arrasto nas palavras vivas ---- */
  function bindLive(p){
    var el=p.el;
    el.addEventListener("pointerdown",function(e){
      if(!ready||picked||e.button>0||p.drag)return;
      interacted=true;e.preventDefault();
      try{el.setPointerCapture(e.pointerId)}catch(_){}
      p.drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:p.x,oy:p.y,moved:false,c:rc(p)};
      showPools(p.live.lampI);
      if(!RM){p.mode="drag";p.tx=p.x;p.ty=p.y;wake(p)}
    });
    el.addEventListener("pointermove",function(e){
      var d=p.drag;if(!d||e.pointerId!==d.id||RM)return;
      var dx=e.clientX-d.sx,dy=e.clientY-d.sy;
      if(!d.moved){if(Math.hypot(dx,dy)<8)return;d.moved=true;el.classList.add("lift");p.st=1.38}
      var tx=d.ox+dx,ty=d.oy+dy-30,z=zone(p.live.lampI),cx=d.c.x+tx,cy=d.c.y+ty,dist=Math.hypot(z.x-cx,z.y-cy);
      if(dist<150){var f=Math.pow(1-dist/150,2)*.7;tx+=(z.x-cx)*f;ty+=(z.y-cy)*f}
      p.tx=tx;p.ty=ty;wake(p);
    });
    var end=function(e,cancel){
      var d=p.drag;if(!d||e.pointerId!==d.id)return;p.drag=null;
      try{el.releasePointerCapture(e.pointerId)}catch(_){}
      if(RM){if(!cancel)fireRM(p);else hidePools();return}
      if(cancel){giveBack(p);return}
      if(!d.moved){tap(p);return}
      var z=zone(p.live.lampI),cx=d.c.x+p.x+p.vx*.15,cy=d.c.y+p.y+p.vy*.15;
      if(cy<geo.H*.46||Math.hypot(z.x-cx,z.y-cy)<120)fly(p,null);else giveBack(p);
    };
    el.addEventListener("pointerup",function(e){end(e,false)});
    el.addEventListener("pointercancel",function(e){end(e,true)});
    el.addEventListener("click",function(e){if(e.detail===0&&ready&&!picked){interacted=true;if(RM)fireRM(p);else fly(p,-560)}});
  }
  function resetPieces(){
    picked=false;ent.classList.remove("pick");
    P.forEach(function(p){if(p.live&&p.landed){p.landed=false;p.el.classList.remove("ink","lift");p.mode="ret";p.st=1;p.asleep=false}});
    hidePools();wake();
  }

  build();buildEnts();buildPieces();layout();dockHeight();
  addEventListener("resize",function(){layout();dockHeight()});
  /* carrega foto antes de começar a sequência */
  var img=imgs[0];
  function go(){ if(RM){showAll()}else{run()} }
  if(document.fonts&&document.fonts.ready){Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,900)})]).then(function(){dockHeight()})}
  if(img.complete&&img.naturalWidth)go();else{img.addEventListener("load",go);img.addEventListener("error",go)}
  ent.addEventListener("pointerdown",function(e){ if(!done&&!e.target.closest(".strip")&&!e.target.closest("a"))skip() });

  /* ---- transição: a luz caminha para dentro da cena ---- */
  var cena=$("cena"),ring=$("ring"),cimg=$("cenaImg"),busy=false,last=null,origin={x:0,y:0};
  var SCENES={
    reserva:{label:"Escrever a visita",src:"/assets/f/casa-2-w.webp",pos:"50% 40%"},
    carta:{label:"Folhear a carta",src:"/assets/f/mignon-g.webp",pos:"34% 50%"}
  };
  function setR(r){
    cena.style.clipPath="circle("+r+"px at "+origin.x+"px "+origin.y+"px)";
    ring.style.background="radial-gradient(circle at "+origin.x+"px "+origin.y+"px,rgba(255,190,110,0) "+Math.max(0,r-2)+"px,rgba(255,196,128,.5) "+(r+3)+"px,rgba(255,170,90,.16) "+(r+70)+"px,rgba(255,150,70,0) "+(r+170)+"px)";
  }
  function anim(from,to,dur,fn,end){
    if(RM){fn(to);end&&end();return}
    var s=performance.now();
    (function f(n){var p=Math.min(1,(n-s)/dur),e=ease2(p);fn(from+(to-from)*e);if(p<1)requestAnimationFrame(f);else end&&end()})(s);
  }
  function openScene(key,x,y,btn){
    if(busy)return;busy=true;last=btn;
    skip();
    var S=SCENES[key];origin={x:x,y:y};
    cimg.src=S.src;cimg.style.objectPosition=S.pos;$("cenaL").textContent=S.label;
    cena.classList.remove("lit");cena.classList.add("show");cena.setAttribute("aria-hidden","false");
    ring.style.opacity=1;setR(0);
    ent.classList.add("walk");ent.setAttribute("inert","");
    var far=Math.max(Math.hypot(x,y),Math.hypot(innerWidth-x,y),Math.hypot(x,innerHeight-y),Math.hypot(innerWidth-x,innerHeight-y))+40;
    requestAnimationFrame(function(){cena.classList.add("lit")});
    anim(14,far,1450,setR,function(){ring.style.opacity=0;cena.style.clipPath="none";$("volt").focus({preventScroll:true});busy=false});
  }
  function closeScene(){
    if(busy)return;busy=true;resetSel();
    var far=Math.max(Math.hypot(origin.x,origin.y),Math.hypot(innerWidth-origin.x,origin.y),Math.hypot(origin.x,innerHeight-origin.y),Math.hypot(innerWidth-origin.x,innerHeight-origin.y))+40;
    cena.classList.remove("lit");ent.classList.remove("walk");ent.removeAttribute("inert");
    ring.style.opacity=1;setR(far);
    anim(far,14,1000,setR,function(){ring.style.opacity=0;cena.classList.remove("show");cena.style.clipPath="circle(0px at 50% 50%)";cena.setAttribute("aria-hidden","true");busy=false;last&&last.focus({preventScroll:true})});
  }
  if(E===0)[].forEach.call(document.querySelectorAll(".strip[data-go]"),function(b){
    b.addEventListener("click",function(e){
      var r=b.getBoundingClientRect(),x=e.clientX,y=e.clientY;
      if(!x&&!y){x=r.left+r.width/2;y=r.top+r.height/2}
      openScene(b.dataset.go,x,y,b);
    });
  });

  /* ---- seleção por modo ---- */
  var dimmer=$("dimmer"),world=$("world"),lantern=$("lantern");
  function dimAt(x,y,r0,r1,a){dimmer.style.background="radial-gradient(circle at "+x+"px "+y+"px,rgba(8,5,3,0) "+r0+"px,rgba(8,5,3,"+a+") "+r1+"px)";dimmer.style.opacity=1}
  function resetSel(){
    if(E===4)resetPieces();
    dimmer.style.opacity=0;world.classList.remove("sel");ent.classList.remove("zoom");world.style.transform="none";
    els.forEach(function(e,k){var l=LAMPS[k];e.h.style.transform="translate("+l.px+"px,"+l.py+"px) scale(1.15)";e.h.style.opacity=l.vis?.5:0;e.c.style.opacity=l.vis?.65:0});
  }
  function choose(i,btn){
    var en=ents[i],d=en.d;
    if(E===1){
      var k=en.k;
      els.forEach(function(e,j){var l=LAMPS[j];e.h.style.transition="transform 1s cubic-bezier(.22,.7,.12,1),opacity .6s ease";e.c.style.transition="opacity .5s ease";
        if(j===k){e.h.style.transform="translate("+l.px+"px,"+l.py+"px) scale(3.1)";e.h.style.opacity=1;e.c.style.opacity=1}
        else{e.h.style.opacity=.1;e.c.style.opacity=.25}});
      dimAt(LAMPS[k].px,LAMPS[k].py+60,60,Math.max(geo.W,geo.H)*.5,.62);
      var go1=function(){openScene(d.key,en.cx,en.cy,btn)};if(RM)go1();else setTimeout(go1,420);
    }else if(E===2){
      if(busy||ent.classList.contains("zoom"))return;
      world.style.transformOrigin=en.cx+"px "+en.cy+"px";
      dimAt(en.cx,en.cy,90,Math.max(geo.W,geo.H)*.55,.7);
      ent.classList.add("zoom");
      world.style.transform="scale(1.85)";world.classList.add("sel");
      var go2=function(){openScene(d.key,en.cx,en.cy,btn)};
      if(RM)go2();else setTimeout(go2,620);
    }else{
      openScene(d.key,lastPt.x,lastPt.y,btn);
    }
  }
  var lastPt={x:0,y:0};
  ents.forEach(function(en,i){
    var go=function(e){if(e&&e.clientX!=null&&(e.clientX||e.clientY))lastPt={x:e.clientX,y:e.clientY};else{var r=en.btn.getBoundingClientRect();lastPt={x:r.left+Math.min(r.width,200)/2,y:r.top+r.height/2}}choose(i,en.btn)};
    en.btn.addEventListener("click",go);
    if(en.pl)en.pl.addEventListener("click",function(){choose(i,en.btn)});
  });

  /* lanterna: só enquanto o dedo está na tela */
  if(E===3){
    var mv=function(e){if(e.pointerType==="mouse"&&!(e.buttons&1))return;lantern.style.transform="translate("+e.clientX+"px,"+e.clientY+"px)";lantern.classList.add("on")};
    var up=function(){lantern.classList.remove("on")};
    ent.addEventListener("pointerdown",mv);ent.addEventListener("pointermove",mv);
    ent.addEventListener("pointerup",up);ent.addEventListener("pointercancel",up);ent.addEventListener("pointerleave",up);
  }
  $("volt").addEventListener("click",closeScene);
  addEventListener("keydown",function(e){if(e.key==="Escape"&&cena.classList.contains("show"))closeScene()});
})();
</script>
</body>
</html>
